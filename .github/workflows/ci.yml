name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# BOOT-21: actions/setup-go@v5 caches the build/module cache with a key that
# includes the Go version and a hash of the file named by cache-dependency-path
# (go.sum, since M02 introduced the first dependency).

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: gofmt -l . | tee /tmp/gofmt.out
      - name: fail on unformatted files
        run: test ! -s /tmp/gofmt.out
      - run: go vet ./...
      # The privileged integration harness is behind the `integration` build
      # tag and never runs on a PR (it needs root). Vet it explicitly so a
      # rename in internal/ cannot break it unnoticed until someone runs
      # `make test-integration`.
      - run: go vet -tags integration ./test/...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-unit
      - run: make test-fuzz-smoke

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make build stamps VERSION from git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: red-mpudp-linux-amd64
          path: bin/red-mpudp
          if-no-files-found: error
