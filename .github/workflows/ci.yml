name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# BOOT-21: setup-go@v5 caches the build/module cache keyed on the Go version
# and a hash of the file named by cache-dependency-path. The repo has no go.sum
# yet (no dependencies), and the action's default (go.sum) would skip caching
# with a warning when the file is absent -- so we key on go.mod explicitly.
# Add go.sum to the path once M02 introduces the first dependency.

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: gofmt -l . | tee /tmp/gofmt.out
      - name: fail on unformatted files
        run: test ! -s /tmp/gofmt.out
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make test-unit
      - run: make test-fuzz-smoke

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make test-race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make build stamps VERSION from git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: red-mpudp-linux-amd64
          path: bin/red-mpudp
          if-no-files-found: error
